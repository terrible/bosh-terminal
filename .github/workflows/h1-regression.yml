name: Bosh Terminal regression

on:
  push:
    branches:
      - main
      - integration/bosh-terminal-candidate
      - 'ci/**'
  pull_request:
    branches:
      - main
      - integration/bosh-terminal-candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash-and-h1:
    name: Bash, ShellCheck and H1 recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: |
          bash -n install.sh uninstall.sh scripts/*.sh scripts/lib/*.sh tests/*.sh
      - name: ShellCheck
        run: |
          shellcheck --norc -x -P SCRIPTDIR install.sh uninstall.sh scripts/*.sh scripts/lib/*.sh tests/*.sh
      - name: Targeted H1 regression in isolated HOME
        run: |
          bash tests/test-recovery-h1.sh
          bash tests/test-temp-artifacts.sh

  arch-full-suite:
    name: Full regression on Arch Linux (non-root, no TTY)
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-20261108.0.623074@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
    timeout-minutes: 20
    steps:
      - name: Install test prerequisites
        run: |
          pacman -Syu --noconfirm --needed git shellcheck diffutils sudo util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bash syntax and ShellCheck
        run: |
          bash -n install.sh uninstall.sh scripts/*.sh scripts/lib/*.sh tests/*.sh
          shellcheck --norc -x -P SCRIPTDIR install.sh uninstall.sh scripts/*.sh scripts/lib/*.sh tests/*.sh
      - name: Run full test suite as unprivileged user with no controlling terminal
        run: |
          useradd -m -s /bin/bash bosh-ci
          chown -R bosh-ci:bosh-ci "$GITHUB_WORKSPACE"
          setsid -w su -s /bin/bash bosh-ci -c "cd '$GITHUB_WORKSPACE' && env -u BOSH_HOME -u BOSH_STATE -u BOSH_BACKUP bash tests/run-tests.sh"
